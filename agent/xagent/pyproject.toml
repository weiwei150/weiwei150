[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xagent"
version = "0.2.0"
description = "A local tool-calling agent with a Python packages layout, TUI, and Web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=6.0",
    "lxml_html_clean>=0.4",
    "openai>=1.30,<4",
    "starlette>=0.37,<2",
    "textual>=0.80,<9",
    "trafilatura>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
xagent = "xagent_cli:main"
xagent-tui = "xagent_tui.__main__:main"
xagent-web = "xagent_server.__main__:main"

[tool.setuptools.packages.find]
where = [
    "packages/core/src",
    "packages/server/src",
    "packages/tui/src",
    "packages/cli/src",
]

[tool.setuptools.package-data]
xagent_server = ["static/*"]
xagent_tui = ["styles.tcss"]
