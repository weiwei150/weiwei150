[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xagent"
version = "0.1.0"
description = "A local file-operation agent with a UI-agnostic core and a Textual TUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30,<4",
    "textual>=0.80,<9",
]

[project.scripts]
xagent = "tui.__main__:main"

[tool.setuptools.packages.find]
include = ["core*", "tui*"]
