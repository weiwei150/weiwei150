[project]
name = "anythingllm-mcp-server"
version = "0.1.0"
description = "第一次更新：AnythingLLM MCP Server，基于 MCP 协议查询工作区"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
anythingllm-mcp = "anythingllm_mcp.server:main"
