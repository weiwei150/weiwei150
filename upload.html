<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档上传</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .box { background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.1); padding: 24px; width: 100%; max-width: 420px; }
    h1 { font-size: 18px; margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px; }
    input[type="file"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
    .info { font-size: 12px; color: #999; margin-top: 4px; }
    .btn { width: 100%; padding: 10px; background: #48cb90; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn:hover { background: #3db87e; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { margin-top: 16px; padding: 12px; border-radius: 4px; font-size: 13px; white-space: pre-wrap; word-break: break-all; display: none; }
    .result.ok { background: #e8f8f0; border: 1px solid #48cb90; color: #1a5c3a; display: block; }
    .result.err { background: #fdecea; border: 1px solid #e74c3c; color: #9c2c2c; display: block; }
  </style>
</head>
<body>
  <div class="box">
    <h1>上传文档到「我的知识库」</h1>
    <form id="form">
      <div class="form-group">
        <label>选择文件</label>
        <input type="file" id="fileInput" required>
      </div>
      <div class="form-group">
        <label>目标工作区</label>
        <input type="text" value="6f5df4cf-b789-4301-9f6f-2956dec9c1c4" readonly>
        <div class="info">我的知识库</div>
      </div>
      <div class="form-group">
        <label for="apiKey">API 密钥</label>
        <input type="password" id="apiKey" required autocomplete="off">
      </div>
      <button type="submit" class="btn" id="btn">上传并嵌入</button>
    </form>
    <div class="result" id="result"></div>
  </div>

  <script>
    const URL = 'http://localhost:3001/api/v1/document/upload';
    const form = document.getElementById('form');
    const fileInput = document.getElementById('fileInput');
    const apiKeyInput = document.getElementById('apiKey');
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      const data = new FormData();
      data.append('file', file);
      data.append('addToWorkspaces', '6f5df4cf-b789-4301-9f6f-2956dec9c1c4');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>上传中...';
      result.className = 'result';
      result.style.display = 'none';

      try {
        const resp = await fetch(URL, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + apiKeyInput.value },
          body: data
        });
        const json = await resp.json();
        if (resp.ok) {
          result.className = 'result ok';
          result.textContent = '上传成功\n\n' + JSON.stringify(json, null, 2);
        } else {
          result.className = 'result err';
          result.textContent = '上传失败\n\n' + JSON.stringify(json, null, 2);
        }
      } catch (err) {
        result.className = 'result err';
        result.textContent = '请求错误\n\n' + err.message;
      }

      btn.disabled = false;
      btn.textContent = '上传并嵌入';
      result.style.display = 'block';
    };
  </script>
</body>
</html>
